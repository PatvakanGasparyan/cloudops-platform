name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check backend

  backend-tests:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  docker:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t cloudops-api:ci .

      - name: Run Docker container
        run: docker run -d --name cloudops-api-ci -p 8000:8000 cloudops-api:ci

      - name: Check container status
        run: docker ps

      - name: Test health endpoint
        run: |
          for i in {1..10}; do
            if curl --fail http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs cloudops-api-ci
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs cloudops-api-ci

      - name: Remove test container
        if: always()
        run: docker rm -f cloudops-api-ci